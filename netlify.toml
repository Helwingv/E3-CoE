[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Advocacy was replaced by NOAH; its pages now live under Resources.
[[redirects]]
  from = "/advocacy/policy-priorities"
  to = "/resources/policy-priorities"
  status = 301

[[redirects]]
  from = "/advocacy/collaboration"
  to = "/resources/collaboration"
  status = 301

[[redirects]]
  from = "/advocacy"
  to = "https://noah.e3coe.com"
  status = 301

# The food program was a Vision 8:28 partnership and isn't part of E3 CoE.
[[redirects]]
  from = "/programs/food-program"
  to = "/programs/community-impact"
  status = 301

# Donations and investments are on the Make A Difference page.
[[redirects]]
  from = "/donate"
  to = "/about/make-a-difference"
  status = 301

# Get Involved became Make A Difference.
[[redirects]]
  from = "/about/get-involved"
  to = "/about/make-a-difference"
  status = 301

# Projects became Centers Of Excellence (CoEs).
[[redirects]]
  from = "/projects"
  to = "/centers-of-excellence"
  status = 301
